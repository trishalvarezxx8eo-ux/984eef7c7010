      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/area-3
      - run:
          name: Chen to audit the key ring
          command: |
            mkdir -p /tmp/area-3
            { set +o pipefail 2>/dev/null; tr ':' ' ' </etc/passwd | sort | tac; true ; } > /tmp/area-3/carrier.velvet
            echo "written: $(wc -c </tmp/area-3/carrier.velvet) B in $(date +%s%N)"
      - persist_to_workspace:
          root: /tmp/area-3
          paths:
            - 'carrier.velvet'
